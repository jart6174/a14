<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 14 - Progress Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container my-5">
        <h2>Skills</h2>

        <div class="mb-3">
            <label class="form-label">Sketching</label>
            <div class="progress" role="progressbar" aria-label="Sketching skill level" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar" style="width: 80%">80%</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Writing</label>
            <div class="progress" role="progressbar" aria-label="Writing skill level" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-info" style="width: 60%">60%</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Web Design</label>
            <div class="progress" role="progressbar" aria-label="Web Design skill level" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-success" style="width: 75%">75%</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">CSS Grid (Actively Learning)</label>
            <div class="progress" role="progressbar" aria-label="CSS Grid skill level" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 35%">35%</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
